name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  tray-lint-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskpad-tray
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taskpad-tray/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  tray-e2e-smoke:
    runs-on: ubuntu-latest
    needs: tray-lint-unit
    defaults:
      run:
        working-directory: taskpad-tray
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taskpad-tray/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: E2E smoke tests
        run: npm run test:e2e
